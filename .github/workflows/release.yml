name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # 1. 准备发布：生成版本号、Changelog、打 Tag
  prepare-release:
    runs-on: ubuntu-latest
    # 只有手动触发时才运行此步骤
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.get_tag.outputs.tag }}
      changelog: ${{ steps.extract_changelog.outputs.notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all tags
        run: |
          # 获取所有远程 tags，确保 standard-version 能识别最新版本
          git fetch --tags --force

      - name: Bump version and push
        run: |
          npm ci

          # 获取最新的 tag 版本（如果存在）
          # 使用 git tag 命令获取最新 tag，按版本号排序
          LATEST_TAG=$(git tag --sort=-version:refname 2>/dev/null | head -1 || echo "")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Latest tag: $LATEST_TAG"
          echo "Current package.json version: $CURRENT_VERSION"

          # 如果存在最新 tag，先同步 package.json 版本到最新 tag 版本
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION=${LATEST_TAG#v}
            echo "Latest tag version: $LATEST_VERSION"
            
            # 比较版本号，如果当前版本低于最新 tag 版本，则更新
            VERSION_COMPARE=$(node -e "
              const semver = require('semver');
              const current = '$CURRENT_VERSION';
              const latest = '$LATEST_VERSION';
              console.log(semver.lt(current, latest) ? 'true' : 'false');
            " 2>/dev/null || echo "false")
            
            if [ "$VERSION_COMPARE" = "true" ]; then
              echo "Updating package.json version from $CURRENT_VERSION to $LATEST_VERSION"
              npm version "$LATEST_VERSION" --no-git-tag-version
              if ! git diff --quiet package.json package-lock.json; then
                git add package.json package-lock.json
                git commit -m "chore: sync version to $LATEST_VERSION" || true
              fi
            fi
          fi

          # 计算将要创建的新 tag
          EXPECTED_TAG=$(node -e "
            const semver = require('semver');
            const current = require('./package.json').version;
            const type = '${{ inputs.release_type }}';
            let next;
            if (type === 'major') next = semver.inc(current, 'major');
            else if (type === 'minor') next = semver.inc(current, 'minor');
            else next = semver.inc(current, 'patch');
            console.log('v' + next);
          ")
          echo "Expected new tag: $EXPECTED_TAG"

          # 检查 tag 是否已存在（本地或远程）
          TAG_EXISTS=false
          if git rev-parse "$EXPECTED_TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
            echo "Tag $EXPECTED_TAG already exists locally"
          elif git ls-remote --tags origin "$EXPECTED_TAG" | grep -q "$EXPECTED_TAG"; then
            TAG_EXISTS=true
            echo "Tag $EXPECTED_TAG already exists on remote"
          fi

          if [ "$TAG_EXISTS" = "true" ]; then
            echo "Tag $EXPECTED_TAG already exists, skipping standard-version"
            echo "Using existing tag: $EXPECTED_TAG"
          else
            # 运行 standard-version 更新版本和 Changelog
            npx standard-version --release-as ${{ inputs.release_type }}
          fi

          # 推送 commits 和 tags 到当前分支
          git push --follow-tags origin HEAD:${{ github.ref_name }}

      - name: Get new tag
        id: get_tag
        run: |
          # 获取最新的 tag
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated new tag: $TAG"

      - name: Extract Changelog
        id: extract_changelog
        run: |
          # 提取最新版本的 Changelog 内容
          CHANGELOG_CONTENT=$(node .github/scripts/extract-changelog.js)

          # 处理多行文本输出到 GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 2. 构建 macOS
  build-mac:
    needs: [prepare-release]
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            args: --x64
          - os: macos-latest
            arch: arm64
            args: --arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (unsigned)
        run: |
          npm run build -- \
            --mac ${{ matrix.args }} \
            -c.mac.identity=null \
            -c.mac.hardenedRuntime=false \
            --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts-${{ matrix.arch }}
          path: release/**/Voice*-Mac-*.dmg
          if-no-files-found: error

  # 3. 构建 Windows
  build-win:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app (unsigned)
        run: npm run build -- --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: release/**/Voice*-Windows-*-Setup.exe
          if-no-files-found: error

  # 4. 发布 Release
  release:
    needs: [prepare-release, build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mac-artifacts-*
          merge-multiple: true
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.new_tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/Voice*-Mac-*.dmg
            artifacts/**/Voice*-Windows-*-Setup.exe
          body: |
            ## 🎉 新版本发布！

            **注意：本项目暂无商业签名证书，安装时可能会提示安全警告。**

            ### 🍎 macOS 用户
            初次安装可能出现 “应用已损坏，无法打开” 或 “来自身份不明的开发者”。

            请打开「终端」执行：

            ```bash
            xattr -cr /Applications/Voice\ Key.app
            ```

            ### 🪟 Windows 用户
            如果出现 SmartScreen 提示：

            1. 点击 “更多信息”
            2. 点击 “仍要运行”

            ---

            ### 更新日志
            ${{ needs.prepare-release.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
